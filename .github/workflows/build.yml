name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true
      - name: Save our files
        run: |
          mkdir -p /tmp/save
          cp lib/main.dart /tmp/save/main.dart
          cp pubspec.yaml /tmp/save/pubspec.yaml
      - name: Create fresh Android project
        run: |
          rm -rf android
          flutter create . --no-pub --project-name fazlaka --org com.fazlaka
      - name: Restore files
        run: |
          cp /tmp/save/main.dart lib/main.dart
          cp /tmp/save/pubspec.yaml pubspec.yaml
          rm -rf test
          rm -f analysis_options.yaml
          flutter pub get
      - name: Inject Bluetooth permissions
        run: |
          python3 << 'PYEOF'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text()
          if 'BLUETOOTH_CONNECT' not in t:
              perms = ""
              perms += '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n'
              perms += '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n'
              perms += '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n'
              perms += '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n'
              perms += '    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n'
              perms += '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              perms += '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              t = t.replace('<application', perms + '    <application', 1)
              p.write_text(t)
              print('permissions injected')
          PYEOF
      - name: Show Real Dart Error
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true
      - name: Build APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fazlaka-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
